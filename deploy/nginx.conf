worker_processes auto;

events {
    worker_connections 4096;
}

http {
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    log_format main '$remote_addr "$request_method $uri" $status $body_bytes_sent $request_time $upstream_addr';

    access_log /dev/stdout main;
    error_log /dev/stderr warn;

    upstream api {
        zone api 64k;
        server api-1:8080 max_fails=1 fail_timeout=2s;
        server api-2:8080 max_fails=1 fail_timeout=2s;
        keepalive 32;
    }

    server {
        listen 80;
        server_tokens off;
        client_max_body_size 1m;

        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_next_upstream error timeout http_503;
        proxy_next_upstream_tries 2;
        proxy_connect_timeout 2s;

        location = /metrics {
            return 404;
        }

        location ~ ^/api/invites/.+/accept$ {
            access_log off;
            error_log /dev/null crit;
            proxy_pass http://api;
        }

        location /ws/ {
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
            proxy_buffering off;
            proxy_pass http://api;
        }

        location / {
            proxy_pass http://api;
        }
    }
}
