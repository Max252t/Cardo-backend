name: cardo

x-api: &api
  image: cardo-api:local
  build:
    context: .
  restart: unless-stopped
  env_file:
    - path: .env
      required: false
  environment: &api-env
    SINGLE_INSTANCE: "false"
    REDIS_URL: redis://redis:6379/0
    DATABASE_URL: postgres://cardo:${POSTGRES_PASSWORD:-cardo}@postgres:5432/cardo?sslmode=disable
    HTTP_ADDR: ":8080"
    TRUSTED_PROXIES: 172.28.0.10/32
    METRICS_ADDR: ":9091"
    JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  stop_grace_period: 30s
  healthcheck:
    test: ["CMD", "/api", "healthcheck"]
    interval: 5s
    timeout: 4s
    retries: 5
    start_period: 10s

services:
  api-1:
    <<: *api
    networks:
      cardo:
        ipv4_address: 172.28.0.11

  api-2:
    <<: *api
    networks:
      cardo:
        ipv4_address: 172.28.0.12

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/nginx-health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api-1:
        condition: service_healthy
      api-2:
        condition: service_healthy
    networks:
      cardo:
        ipv4_address: 172.28.0.10

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cardo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cardo}
      POSTGRES_DB: cardo
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cardo -d cardo"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks:
      - cardo

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks:
      - cardo

  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: ["monitoring"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - api-1
      - api-2
    networks:
      - cardo

  grafana:
    image: grafana/grafana:11.3.1
    profiles: ["monitoring"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - cardo

networks:
  cardo:
    ipam:
      config:
        - subnet: 172.28.0.0/16
          ip_range: 172.28.1.0/24

volumes:
  postgres-data:
  prometheus-data:
  grafana-data:
