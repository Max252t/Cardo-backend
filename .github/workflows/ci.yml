name: CI

on:
  push:
    branches: [main, develop, "feature/**", "release/**", "hotfix/**"]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: detect
        name: Detect Go sources
        run: |
          if [ -n "$(find . -name '*.go' -not -path './vendor/*' -print -quit)" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-go@v5
        if: steps.detect.outputs.present == 'true'
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        if: steps.detect.outputs.present == 'true'
        run: |
          unformatted="$(gofmt -l $(find . -name '*.go' -not -path './vendor/*'))"
          if [ -n "$unformatted" ]; then
            echo "Files not formatted with gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go mod tidy check
        if: steps.detect.outputs.present == 'true'
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: go vet
        if: steps.detect.outputs.present == 'true'
        run: go vet ./...

      - uses: golangci/golangci-lint-action@v8
        if: steps.detect.outputs.present == 'true'
        with:
          version: latest

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - id: detect
        name: Detect Go sources
        run: |
          if [ -n "$(find . -name '*.go' -not -path './vendor/*' -print -quit)" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-go@v5
        if: steps.detect.outputs.present == 'true'
        with:
          go-version-file: go.mod
          cache: true

      - name: Unit and integration tests
        if: steps.detect.outputs.present == 'true'
        run: |
          set -o pipefail
          go test -race -count=1 -timeout 15m -coverprofile=coverage.out -covermode=atomic ./... 2>&1 | tee test.log

      - name: Report test failures
        if: failure() && steps.detect.outputs.present == 'true'
        run: |
          grep -E -- '^\s*--- FAIL|^FAIL\s|^panic:|WARNING: DATA RACE|_test\.go:[0-9]+:' test.log | head -n 50 | while IFS= read -r line; do
            echo "::error::${line}"
          done

      - name: Coverage summary
        if: steps.detect.outputs.present == 'true'
        run: go tool cover -func=coverage.out | tail -n 1

      - uses: actions/upload-artifact@v4
        if: steps.detect.outputs.present == 'true'
        with:
          name: coverage
          path: coverage.out
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - id: detect
        name: Detect sources
        run: |
          if [ -n "$(find . -name '*.go' -not -path './vendor/*' -print -quit)" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi
          if [ -f Dockerfile ]; then
            echo "docker=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-go@v5
        if: steps.detect.outputs.go == 'true'
        with:
          go-version-file: go.mod
          cache: true

      - name: go build
        if: steps.detect.outputs.go == 'true'
        run: go build ./...

      - name: Docker image
        if: steps.detect.outputs.docker == 'true'
        run: docker build -t cardo-backend:ci .
